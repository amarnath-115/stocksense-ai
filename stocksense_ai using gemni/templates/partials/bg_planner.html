<div class="appbg-planner" aria-hidden="true">
<style>
.appbg-planner { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.appbg-planner canvas{position:fixed;inset:0;width:100%;height:100%;}
.appbg-planner .ui{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 55%,rgba(16,185,129,0.10),transparent 65%),
             radial-gradient(ellipse 35% 35% at 85% 10%,rgba(245,158,11,0.08),transparent 55%);}
</style>
<canvas id="c-planner"></canvas>
<div class="ui"></div>
</div>
<script>
(function(){
  const __reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c-planner'),ctx=cv.getContext('2d');
let W=cv.width=innerWidth,H=cv.height=innerHeight;
window.addEventListener('resize',()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;});
const r=(a,b)=>a+Math.random()*(b-a);
const P=['#10b981','#f59e0b','#22d3ee','#8b5cf6','#6ee7b7'];

// Tree / growth bots (money tree growing upward)
class TreeBot{
  constructor(init){
    this.x=r(50,W-50);this.y=init?r(0,H):H+150;
    this.h=r(50,110);this.w=r(14,32);this.c=P[~~r(0,P.length)];
    this.a=r(0.15,0.42);this.vy=-r(0.2,0.5);
    this.pt=r(0,6.28);this.pv=r(0.015,0.04);
    // branches
    this.branches=Array.from({length:~~r(2,5)},(_,i)=>({
      level:r(0.3,0.8),angle:r(20,60)*(Math.random()<0.5?1:-1),len:r(15,35)
    }));
    // leaves (coin dots)
    this.leaves=Array.from({length:~~r(5,10)},()=>({ox:r(-this.w,this.w),oy:r(-this.h*.8,-this.h*.1),t:r(0,6.28),tv:r(0.02,0.05),r:r(4,9)}));
  }
  tick(){this.y+=this.vy;this.pt+=this.pv;this.leaves.forEach(l=>{l.t+=l.tv;});if(this.y<-180){this.y=H+150;this.x=r(50,W-50);}}
  draw(){
    const p=0.75+0.25*Math.sin(this.pt);
    ctx.save();ctx.translate(this.x,this.y);ctx.globalAlpha=this.a*p;
    // trunk
    ctx.strokeStyle=this.c;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-this.h);ctx.stroke();
    // branches
    this.branches.forEach(br=>{
      const by=-this.h*br.level;const rad=br.angle*Math.PI/180;
      ctx.beginPath();ctx.moveTo(0,by);
      ctx.lineTo(Math.cos(rad)*br.len,by+Math.sin(rad)*br.len);
      ctx.strokeStyle=this.c;ctx.lineWidth=1.5;ctx.stroke();
    });
    // leaves (coins)
    this.leaves.forEach(l=>{
      const lx=l.ox+Math.sin(l.t)*4,ly=l.oy+Math.cos(l.t*0.7)*3;
      const g=ctx.createRadialGradient(lx,ly,0,lx,ly,l.r);
      g.addColorStop(0,'rgba(245,158,11,0.9)');g.addColorStop(1,'rgba(120,80,0,0.3)');
      ctx.beginPath();ctx.arc(lx,ly,l.r,0,6.28);ctx.fillStyle=g;ctx.globalAlpha=this.a*p*.8;ctx.fill();
      ctx.strokeStyle=this.c;ctx.lineWidth=0.8;ctx.stroke();
    });
    // root glow
    const rg=ctx.createRadialGradient(0,0,2,0,0,30);
    rg.addColorStop(0,this.c+'44');rg.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(0,0,30,0,6.28);ctx.fillStyle=rg;ctx.globalAlpha=this.a*p;ctx.fill();
    ctx.restore();ctx.globalAlpha=1;
  }
}

// Line chart bots (portfolio curves)
class ChartBot{
  constructor(init){
    this.x=r(40,W-200);this.y=init?r(0,H):H+80;
    this.vy=-r(0.25,0.6);this.c=P[~~r(0,P.length)];this.a=r(0.15,0.38);
    this.pts=[];let last=0;
    for(let i=0;i<18;i++){last+=r(-8,14);this.pts.push(last);}
    this.pt2=r(0,6.28);this.pv=r(0.02,0.04);this.spanW=r(120,220);
  }
  tick(){this.y+=this.vy;this.pt2+=this.pv;this.pts=this.pts.map((v,i,a)=>i>0?v+(r(-0.5,0.9)):v);if(this.y<-100){this.y=H+80;this.x=r(40,W-200);}}
  draw(){
    const p=0.75+0.25*Math.sin(this.pt2);
    const mn=Math.min(...this.pts),mx=Math.max(...this.pts),range=mx-mn||1;
    ctx.save();ctx.translate(this.x,this.y);ctx.globalAlpha=this.a*p;
    // area fill
    ctx.beginPath();
    this.pts.forEach((v,i)=>{const px=i*(this.spanW/(this.pts.length-1));const py=-((v-mn)/range)*50;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.lineTo(this.spanW,0);ctx.lineTo(0,0);ctx.closePath();
    const ag=ctx.createLinearGradient(0,-50,0,0);ag.addColorStop(0,this.c+'55');ag.addColorStop(1,this.c+'05');
    ctx.fillStyle=ag;ctx.fill();
    // line
    ctx.beginPath();
    this.pts.forEach((v,i)=>{const px=i*(this.spanW/(this.pts.length-1));const py=-((v-mn)/range)*50;i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);});
    ctx.strokeStyle=this.c;ctx.lineWidth=1.8;ctx.stroke();
    // endpoint dot
    const lpx=this.spanW,lpy=-((this.pts[this.pts.length-1]-mn)/range)*50;
    ctx.beginPath();ctx.arc(lpx,lpy,4,0,6.28);ctx.fillStyle=this.c;ctx.fill();
    // mini robot on the dot
    ctx.strokeStyle=this.c;ctx.lineWidth=1;ctx.strokeRect(lpx-5,lpy-10,10,8);
    ctx.beginPath();ctx.arc(lpx-2,lpy-6,1.5,0,6.28);ctx.fillStyle=this.c;ctx.fill();
    ctx.beginPath();ctx.arc(lpx+2,lpy-6,1.5,0,6.28);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;
  }
}

// Shield protection bots (protecting portfolio)
class ShieldBot{
  constructor(init){
    this.x=r(50,W-50);this.y=init?r(0,H):H+90;
    this.size=r(18,42);this.c=P[~~r(0,P.length)];this.a=r(0.15,0.4);
    this.vy=-r(0.2,0.55);this.rot=r(0,6.28);this.rv=r(-0.007,0.007);
    this.pt=r(0,6.28);this.pv=r(0.015,0.035);
  }
  tick(){this.y+=this.vy;this.rot+=this.rv;this.pt+=this.pv;if(this.y<-110){this.y=H+90;this.x=r(50,W-50);}}
  draw(){
    const p=0.75+0.25*Math.sin(this.pt);
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.globalAlpha=this.a*p;
    const g=ctx.createRadialGradient(0,0,2,0,0,this.size*1.5);
    g.addColorStop(0,this.c+'33');g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(0,0,this.size*1.5,0,6.28);ctx.fillStyle=g;ctx.fill();
    // shield shape
    ctx.beginPath();ctx.moveTo(0,-this.size);ctx.bezierCurveTo(this.size*1.1,-this.size*0.8,this.size*1.1,this.size*0.1,0,this.size*1.1);
    ctx.bezierCurveTo(-this.size*1.1,this.size*0.1,-this.size*1.1,-this.size*0.8,0,-this.size);
    ctx.strokeStyle=this.c;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=this.c+'18';ctx.fill();
    // shield emblem
    ctx.fillStyle=this.c;ctx.font=`bold ${this.size*.55}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(['₹','$','%','▲'][~~(this.pt)%4],0,this.size*.1);
    ctx.restore();ctx.globalAlpha=1;
  }
}

const trees=Array.from({length:14},(_,i)=>new TreeBot(true));
const charts=Array.from({length:14},(_,i)=>new ChartBot(true));
const shields=Array.from({length:12},(_,i)=>new ShieldBot(true));

function frame(){
  ctx.fillStyle='#080a06';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(16,185,129,0.045)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=56){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=56){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  trees.forEach(t=>{t.tick();t.draw();});
  charts.forEach(c=>{c.tick();c.draw();});
  shields.forEach(s=>{s.tick();s.draw();});
  if(!__reduceMotion) requestAnimationFrame(frame);}
frame();
})();
</script>
