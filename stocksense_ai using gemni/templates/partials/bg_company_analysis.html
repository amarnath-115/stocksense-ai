<div class="appbg-company_analysis" aria-hidden="true">
<style>
.appbg-company_analysis { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.appbg-company_analysis canvas{position:fixed;inset:0;width:100%;height:100%;}
.appbg-company_analysis .ui{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 70% at 30% 30%,rgba(34,211,238,0.10),transparent 65%),
             radial-gradient(ellipse 50% 50% at 80% 80%,rgba(16,185,129,0.08),transparent 60%);}
</style>
<canvas id="c-company_analysis"></canvas>
<div class="ui"></div>
</div>
<script>
(function(){
  const __reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c-company_analysis'),ctx=cv.getContext('2d');
let W=cv.width=innerWidth,H=cv.height=innerHeight;
window.addEventListener('resize',()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;});
const P=['#22d3ee','#10b981','#6366f1','#f59e0b','#8b5cf6'];
const r=(a,b)=>a+Math.random()*(b-a);
const TKS=['TCS','INFY','RIL','HDFC','AAPL','GOOG','MSFT','NVDA','AMZN','META','WIPRO','BAJAJ'];

// Ring robots with ticker + spinning arms
class RingBot{
  constructor(init){
    this.x=r(80,W-80);this.y=init?r(0,H):H+100;
    this.rad=r(24,55);this.rot=r(0,6.28);this.rv=r(0.008,0.025)*(Math.random()<.5?1:-1);
    this.c=P[~~r(0,P.length)];this.a=r(0.2,0.52);this.vy=-r(0.25,0.7);
    this.tick2=this.tickers=TKS[~~r(0,TKS.length)];
    this.change=(r(-3,3)).toFixed(2);this.up=this.change>0;
    this.pt=r(0,6.28);this.spokes=~~r(4,8);
    // antenna
    this.antH=r(12,24);
  }
  tick(){this.y+=this.vy;this.rot+=this.rv;this.pt+=0.025;if(this.y<-130)this.reset();}
  reset(){this.y=H+100;this.x=r(80,W-80);this.tick2=TKS[~~r(0,TKS.length)];this.change=(r(-3,3)).toFixed(2);this.up=this.change>0;}
  draw(){
    const p=0.75+0.25*Math.sin(this.pt);
    ctx.save();ctx.translate(this.x,this.y);
    // antenna
    ctx.beginPath();ctx.moveTo(0,-this.rad);ctx.lineTo(0,-this.rad-this.antH);
    ctx.strokeStyle=this.c;ctx.lineWidth=1.5;ctx.globalAlpha=this.a*p;ctx.stroke();
    ctx.beginPath();ctx.arc(0,-this.rad-this.antH,4,0,6.28);ctx.fillStyle=this.c;ctx.globalAlpha=this.a*p*(0.6+0.4*Math.sin(this.pt*3));ctx.fill();
    // outer ring
    ctx.rotate(this.rot);
    ctx.beginPath();ctx.arc(0,0,this.rad,0,6.28);
    ctx.strokeStyle=this.c;ctx.lineWidth=1.8;ctx.globalAlpha=this.a*p;ctx.stroke();
    // spokes
    for(let i=0;i<this.spokes;i++){
      const a=i*Math.PI*2/this.spokes;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*this.rad,Math.sin(a)*this.rad);
      ctx.lineTo(Math.cos(a)*(this.rad+14),Math.sin(a)*(this.rad+14));
      ctx.strokeStyle=this.c;ctx.lineWidth=1;ctx.globalAlpha=this.a*.6*p;ctx.stroke();
      ctx.beginPath();ctx.arc(Math.cos(a)*(this.rad+14),Math.sin(a)*(this.rad+14),2.5,0,6.28);
      ctx.fillStyle=this.c;ctx.globalAlpha=this.a*.8*p;ctx.fill();
    }
    ctx.rotate(-this.rot);
    // glow fill
    const g=ctx.createRadialGradient(0,0,0,0,0,this.rad);
    g.addColorStop(0,this.c+'22');g.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(0,0,this.rad,0,6.28);ctx.fillStyle=g;ctx.globalAlpha=1;ctx.fill();
    // ticker text
    const tc=this.up?'#10b981':'#f43f5e';
    ctx.globalAlpha=this.a*1.6*p;ctx.fillStyle=tc;
    ctx.font=`bold ${this.rad*.38}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(this.tick2,0,-this.rad*.2);
    ctx.font=`${this.rad*.3}px monospace`;
    ctx.fillText((this.up?'▲':'▼')+Math.abs(this.change)+'%',0,this.rad*.3);
    ctx.restore();ctx.globalAlpha=1;
  }
}

// DNA helix rising
class Helix{
  constructor(init){
    this.x=r(60,W-60);this.y=init?r(-400,H):H+220;
    this.vy=-r(0.35,0.75);this.c=P[~~r(0,P.length)];
    this.len=r(200,420);this.amp=r(28,65);this.freq=r(0.04,0.09);
    this.t=r(0,6.28);this.a=r(0.2,0.55);
  }
  tick(){this.y+=this.vy;this.t+=0.008;if(this.y<-500)this.reset();}
  reset(){this.y=H+220;this.x=r(60,W-60);}
  draw(){
    for(let i=0;i<this.len;i+=7){
      const y=this.y+i;if(y<-10||y>H+10)continue;
      const x1=this.x+Math.sin(this.freq*i+this.t)*this.amp;
      const x2=this.x+Math.sin(this.freq*i+this.t+Math.PI)*this.amp;
      const a=this.a*(0.4+0.6*Math.abs(Math.sin(this.freq*i+this.t)));
      ctx.beginPath();ctx.arc(x1,y,3,0,6.28);ctx.fillStyle=this.c;ctx.globalAlpha=a;ctx.fill();
      ctx.beginPath();ctx.arc(x2,y,3,0,6.28);ctx.fillStyle=this.c;ctx.globalAlpha=a*.7;ctx.fill();
      if(i%32===0){ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.strokeStyle=this.c;ctx.lineWidth=1;ctx.globalAlpha=a*.4;ctx.stroke();}
    }
    ctx.globalAlpha=1;
  }
}

// Coin robots
class Coin{
  constructor(init){this.x=r(40,W-40);this.y=init?r(0,H):H+60;this.rad=r(14,30);this.vy=-r(0.4,0.9);this.rot=r(0,6.28);this.rv=r(-0.03,0.03);this.t=r(0,6.28);this.sym=['$','₹','€','¥','฿'][~~r(0,5)];}
  tick(){this.y+=this.vy;this.rot+=this.rv;this.t+=0.04;if(this.y<-70)this.reset();}
  reset(){this.y=H+60;this.x=r(40,W-40);}
  draw(){
    ctx.save();ctx.translate(this.x,this.y);
    const sx=Math.abs(Math.cos(this.rot));
    ctx.scale(sx<0.08?0.08:sx,1);
    ctx.globalAlpha=0.4*(0.8+0.2*Math.sin(this.t));
    ctx.beginPath();ctx.arc(0,0,this.rad,0,6.28);
    const g=ctx.createRadialGradient(-this.rad*.3,-this.rad*.3,1,0,0,this.rad);
    g.addColorStop(0,'rgba(245,158,11,0.95)');g.addColorStop(0.6,'rgba(217,119,6,0.75)');g.addColorStop(1,'rgba(120,53,15,0.5)');
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(245,200,50,0.7)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='rgba(255,240,150,0.95)';ctx.font=`bold ${this.rad*.85}px monospace`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.sym,0,1);
    ctx.restore();ctx.globalAlpha=1;
  }
}

const rings=Array.from({length:18},(_,i)=>new RingBot(true));
const helices=Array.from({length:8},(_,i)=>new Helix(true));
const coins=Array.from({length:14},(_,i)=>new Coin(true));

function frame(){
  ctx.fillStyle='#060b10';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(34,211,238,0.045)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=56){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=56){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  helices.forEach(h=>{h.tick();h.draw();});
  rings.forEach(b=>{b.tick();b.draw();});
  coins.forEach(c=>{c.tick();c.draw();});
  if(!__reduceMotion) requestAnimationFrame(frame);}
frame();
})();
</script>
